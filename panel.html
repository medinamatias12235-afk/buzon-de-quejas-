<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6fb">
  <title>Panel de quejas</title>
  <style>
    :root {
      --azul: #4d6bfe;
      --texto: #0d0d0d;
      --texto-suave: #5b6172;
      --borde: #e5e7eb;
      --fondo: #f4f6fb;
      --alta: #e5484d;
      --media: #e8a33d;
      --baja: #2f9e44;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--fondo);
      color: var(--texto);
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
    }
    .envoltura { width: 100%; max-width: 640px; padding: 24px 16px 48px; }

    .barra { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .volver {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--azul); text-decoration: none; font-size: 14px; font-weight: 600;
      padding: 8px 12px; border-radius: 10px; background: #fff;
      border: 1px solid var(--borde);
    }
    .volver:active { transform: scale(.98); }
    .relleno { flex: 1; }
    .recargar {
      display: inline-flex; align-items: center; gap: 6px;
      background: #fff; border: 1px solid var(--borde); color: var(--texto-suave);
      font-size: 13.5px; font-weight: 600; padding: 8px 14px;
      border-radius: 10px; cursor: pointer; font-family: inherit;
    }
    .recargar:hover { border-color: var(--azul); color: var(--azul); }
    .recargar:disabled { opacity: .6; cursor: default; }

    h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; }
    .total {
      font-size: 13px; font-weight: 700; color: var(--azul);
      background: #eef1ff; border-radius: 999px; padding: 3px 11px;
      font-variant-numeric: tabular-nums;
    }
    .descripcion { margin: 0 0 22px; color: var(--texto-suave); font-size: 14px; }

    .estado {
      background: #fff; border: 1px solid var(--borde); border-radius: 16px;
      padding: 28px 20px; text-align: center; color: var(--texto-suave);
      font-size: 14.5px; line-height: 1.5;
    }
    .estado.error { color: #b42318; background: #fff7f7; border-color: #f5c2c0; }

    .grupo { margin-bottom: 28px; }
    .grupo-cabecera {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 700; letter-spacing: .04em;
      text-transform: uppercase; color: var(--texto-suave);
      margin-bottom: 10px;
    }
    .punto { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
    .grupo.alta .punto { background: var(--alta); }
    .grupo.media .punto { background: var(--media); }
    .grupo.baja .punto { background: var(--baja); }
    .grupo.alta .grupo-cabecera { color: #c92a2a; }
    .grupo.media .grupo-cabecera { color: #b7791f; }
    .grupo.baja .grupo-cabecera { color: #2b8a3e; }
    .cuenta { font-weight: 600; color: var(--texto-suave); text-transform: none; letter-spacing: 0; }

    .queja {
      background: #fff; border: 1px solid var(--borde);
      border-left: 4px solid var(--borde);
      border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, .04);
    }
    .grupo.alta .queja { border-left-color: var(--alta); }
    .grupo.media .queja { border-left-color: var(--media); }
    .grupo.baja .queja { border-left-color: var(--baja); }

    .queja-meta {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      margin-bottom: 8px; font-size: 12px;
    }
    .badge {
      padding: 3px 10px; border-radius: 999px; font-weight: 700;
      text-transform: capitalize; font-size: 11.5px; letter-spacing: .01em;
    }
    .badge.alta { background: #fdecec; color: #c92a2a; }
    .badge.media { background: #fff4e0; color: #b7791f; }
    .badge.baja { background: #e9f7ee; color: #2b8a3e; }
    .categoria {
      background: #f1f3f8; color: var(--texto-suave);
      padding: 3px 10px; border-radius: 999px; font-weight: 600;
      max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .fecha { margin-left: auto; color: #8b90a0; font-variant-numeric: tabular-nums; white-space: nowrap; }

    .queja-texto {
      margin: 0; font-size: 14.5px; line-height: 1.55;
      white-space: pre-wrap; overflow-wrap: anywhere; color: #24262e;
    }
  </style>
</head>
<body>
  <main class="envoltura">
    <nav class="barra">
      <a class="volver" href="/index.html">← Nueva queja</a>
      <span class="relleno"></span>
      <button id="recargar" class="recargar" type="button">↻ Actualizar</button>
    </nav>

    <h1>Panel de quejas <span id="total" class="total">0</span></h1>
    <p class="descripcion">Ordenadas por prioridad (alta, media, baja) y después por fecha, de la más reciente a la más antigua.</p>

    <div id="estado" class="estado">Cargando quejas…</div>
    <div id="lista"></div>
  </main>

  <script>
    const lista = document.getElementById('lista');
    const estado = document.getElementById('estado');
    const total = document.getElementById('total');
    const boton = document.getElementById('recargar');

    const ORDEN = ['alta', 'media', 'baja'];
    const ETIQUETA = { alta: 'Alta', media: 'Media', baja: 'Baja' };

    // Convierte la fecha guardada (ISO 8601 en UTC) a algo legible en español.
    function formatearFecha(valor) {
      if (!valor) return '';
      let s = String(valor);
      if (!/[zZ]$|[+-]\d{2}:?\d{2}$/.test(s)) {
        s = s.replace(' ', 'T') + 'Z';
      }
      const fecha = new Date(s);
      if (Number.isNaN(fecha.getTime())) return String(valor);
      return fecha.toLocaleString('es', {
        day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit',
      });
    }

    // Seguridad: todo el contenido se inserta con textContent, nunca con innerHTML,
    // así el texto de la queja se muestra escapado y no puede inyectar HTML.
    function crearTarjeta(queja) {
      const articulo = document.createElement('article');
      articulo.className = 'queja';

      const meta = document.createElement('div');
      meta.className = 'queja-meta';

      const prioridad = ORDEN.includes(queja.prioridad) ? queja.prioridad : 'baja';

      const badge = document.createElement('span');
      badge.className = 'badge ' + prioridad;
      badge.textContent = ETIQUETA[prioridad];
      meta.appendChild(badge);

      if (queja.categoria) {
        const categoria = document.createElement('span');
        categoria.className = 'categoria';
        categoria.textContent = queja.categoria;
        meta.appendChild(categoria);
      }

      const fecha = document.createElement('span');
      fecha.className = 'fecha';
      fecha.textContent = formatearFecha(queja.creada);
      meta.appendChild(fecha);

      const parrafo = document.createElement('p');
      parrafo.className = 'queja-texto';
      parrafo.textContent = queja.texto || '';

      articulo.appendChild(meta);
      articulo.appendChild(parrafo);
      return articulo;
    }

    function renderizar(quejas) {
      lista.textContent = '';
      total.textContent = String(quejas.length);

      if (!quejas.length) {
        estado.hidden = false;
        estado.className = 'estado';
        estado.textContent = 'Todavía no hay quejas registradas. Cuando alguien envíe una, aparecerá aquí.';
        return;
      }

      estado.hidden = true;

      for (const prioridad of ORDEN) {
        const grupo = quejas.filter((q) => q.prioridad === prioridad);
        if (!grupo.length) continue;

        const seccion = document.createElement('section');
        seccion.className = 'grupo ' + prioridad;

        const cabecera = document.createElement('h2');
        cabecera.className = 'grupo-cabecera';

        const punto = document.createElement('span');
        punto.className = 'punto';
        punto.setAttribute('aria-hidden', 'true');

        cabecera.appendChild(punto);
        cabecera.appendChild(document.createTextNode(ETIQUETA[prioridad]));

        const cuenta = document.createElement('span');
        cuenta.className = 'cuenta';
        cuenta.textContent = '(' + grupo.length + ')';
        cabecera.appendChild(cuenta);

        seccion.appendChild(cabecera);
        grupo.forEach((queja) => seccion.appendChild(crearTarjeta(queja)));
        lista.appendChild(seccion);
      }
    }

    async function cargar() {
      boton.disabled = true;
      try {
        const respuesta = await fetch('/api/quejas', { cache: 'no-store' });
        let datos = {};
        try { datos = await respuesta.json(); } catch (_) { /* respuesta vacía */ }

        if (!respuesta.ok) {
          throw new Error(datos.error || 'No se pudieron cargar las quejas.');
        }

        renderizar(Array.isArray(datos.quejas) ? datos.quejas : []);
      } catch (error) {
        lista.textContent = '';
        total.textContent = '0';
        estado.hidden = false;
        estado.className = 'estado error';
        estado.textContent = error.message || 'Error de conexión al cargar las quejas.';
      } finally {
        boton.disabled = false;
      }
    }

    boton.addEventListener('click', cargar);
    cargar();
    setInterval(cargar, 30000);
  </script>
</body>
</html>
